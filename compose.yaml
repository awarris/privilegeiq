services:
  postgres:
    image: postgres:16-alpine
    container_name: privilegeiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: privilegeiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55473:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d privilegeiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - privilegeiq_postgres_data:/var/lib/postgresql/data

volumes:
  privilegeiq_postgres_data:
